packages:
  - 'projects/*'
  - 'projects/common/*'

# https://pnpm.io/supply-chain-security
minimumReleaseAge: 10080 # 1 week
blockExoticSubdeps: true
ignoreScripts: true
allowBuilds:
  esbuild: true

overrides:
  fast-uri: ^3.1.5 # contracts>better-npm-audit>table>ajv>fast-uri (GHSA-7p8r-x3mc-p8w7)
  linkify-it: ^5.0.2 # ggov-frontend>tiptap-markdown/prosemirror-markdown>markdown-it>linkify-it (GHSA-v245-v573-v5vm)
  sharp: ^0.35.3 # ggov-frontend>@cloudflare/vite-plugin/wrangler>miniflare>sharp (GHSA-f88m-g3jw-g9cj)
  undici: ^7.29.0 # ggov-frontend>@cloudflare/vite-plugin/wrangler>miniflare>undici (GHSA-4cwx-7wf7-3272)
  tar: ^7.5.21 # contracts>@algorandfoundation/puya-ts>tar (GHSA-r292-9mhp-454m)
  postcss: ^8.5.23 # common>ggov-algoquarters>vitest>@vitest/mocker>vite>postcss (GHSA-fxqj-rqcc-2cmp)
  nanoid: ^3.3.18 # common>ggov-algoquarters>vitest>@vitest/mocker>vite>postcss>nanoid (GHSA-2v37-7h3g-55p8)
  'js-yaml@4': ^4.3.1 # ggov-frontend>@tanstack/react-start>...>xmlbuilder2>js-yaml (GHSA-5p4m-2wfm-xmqj)
  'ws@7': ^7.5.11 # ggov-frontend>@blockshake/defly-connect>@walletconnect>ws (GHSA-96hv-2xvq-fx4p)
  # ggov-frontend>@storybook/react-vite pins 0.6.1, which drags in glob@10>minimatch@9>brace-expansion@2.
  # The 2.x line has no fix for GHSA-mh99-v99m-4gvg and 5.x is not API-compatible with minimatch@9, so bump
  # the plugin instead: 0.6.4 uses glob@13>minimatch@10>brace-expansion@5. Stay below 0.7.0, which is ESM-only.
  '@joshwooding/vite-plugin-react-docgen-typescript': ^0.6.4
  'brace-expansion@5': ^5.0.9 # eslint>...>minimatch>brace-expansion (GHSA-rgw5-rvv9-x895)

minimumReleaseAgeExclude:
  - nanoid # 3.3.18 published 2026-08-07T16:41Z; drop this once it clears the 1-week age
