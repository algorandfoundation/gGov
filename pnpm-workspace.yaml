packages:
  - 'projects/*'
  - 'projects/common/*'

# https://pnpm.io/supply-chain-security
minimumReleaseAge: 10080 # 1 week
blockExoticSubdeps: true
ignoreScripts: true
allowBuilds:
  esbuild: true

overrides:
  fast-uri: ^3.1.2 # contracts>better-npm-audit>table>ajv>fast-uri
  flatted: ^3.4.2 # eslint>file-entry-cache>flat-cache>flatted
  rollup: ^4.59.0 # contracts>@rollup/plugin-typescript>rollup
  tar: ^7.5.19 # contracts>@algorandfoundation/puya-ts>tar (GHSA-23hp-3jrh-7fpw, GHSA-8x88-c5mf-7j5w)
  'js-yaml@4': ^4.3.0 # ggov-frontend>@tanstack/react-start>...>xmlbuilder2>js-yaml (GHSA-52cp-r559-cp3m)
  'minimatch@9': ^9.0.9 # contracts>@vitest/coverage-v8>test-exclude>minimatch
  'minimatch@10': ^10.2.5 # contracts>@algorandfoundation/puya-ts>minimatch
  'picomatch@4': ^4.0.4 # eslint-plugin-unused-imports>@typescript-eslint>tinyglobby>picomatch
  'ws@7': ^7.5.11 # ggov-frontend>@blockshake/defly-connect>@walletconnect>ws
  '@isaacs/brace-expansion': ^5.0.1 # contracts>@algorandfoundation/puya-ts>minimatch>@isaacs/brace-expansion
  'brace-expansion@2': ^2.1.2 # ggov-frontend>@storybook/react-vite>...>minimatch>brace-expansion (GHSA-3jxr-9vmj-r5cp)
  'brace-expansion@5': ^5.0.7 # eslint>...>minimatch>brace-expansion (GHSA-3jxr-9vmj-r5cp)
