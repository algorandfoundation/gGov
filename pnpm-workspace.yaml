packages:
  - 'projects/*'
  - 'projects/common/*'

# https://pnpm.io/supply-chain-security
minimumReleaseAge: 10080 # 1 week
blockExoticSubdeps: true
ignoreScripts: true
allowBuilds:
  esbuild: true

overrides:
  fast-uri: ^3.1.4 # contracts>better-npm-audit>table>ajv>fast-uri (GHSA-4c8g-83qw-93j6, GHSA-v2hh-gcrm-f6hx)
  linkify-it: ^5.0.2 # ggov-frontend>tiptap-markdown/prosemirror-markdown>markdown-it>linkify-it (GHSA-v245-v573-v5vm)
  sharp: ^0.35.3 # ggov-frontend>@cloudflare/vite-plugin/wrangler>miniflare>sharp (GHSA-f88m-g3jw-g9cj)
  flatted: ^3.4.2 # eslint>file-entry-cache>flat-cache>flatted
  rollup: ^4.59.0 # contracts>@rollup/plugin-typescript>rollup
  tar: ^7.5.19 # contracts>@algorandfoundation/puya-ts>tar (GHSA-23hp-3jrh-7fpw, GHSA-8x88-c5mf-7j5w)
  postcss: ^8.5.19 # common>ggov-algoquarters>vitest>@vitest/mocker>vite>postcss (GHSA-6g55-p6wh-862q)
  'js-yaml@4': ^4.3.0 # ggov-frontend>@tanstack/react-start>...>xmlbuilder2>js-yaml (GHSA-52cp-r559-cp3m)
  'minimatch@9': ^10.2.5 # ggov-frontend>@storybook/react-vite>...>glob>minimatch (GHSA-mh99-v99m-4gvg)
  'minimatch@10': ^10.2.5 # contracts>@algorandfoundation/puya-ts>minimatch
  'picomatch@4': ^4.0.4 # eslint-plugin-unused-imports>@typescript-eslint>tinyglobby>picomatch
  'ws@7': ^7.5.11 # ggov-frontend>@blockshake/defly-connect>@walletconnect>ws
  '@isaacs/brace-expansion': ^5.0.1 # contracts>@algorandfoundation/puya-ts>minimatch>@isaacs/brace-expansion
  'brace-expansion@5': ^5.0.8 # eslint>...>minimatch>brace-expansion (GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg)

minimumReleaseAgeExclude:
  - brace-expansion@5.0.8 # 5 days old at this commit time - remove when minimumReleaseAge is surpassed
