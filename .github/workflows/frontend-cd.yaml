name: Deploy frontend (testnet)

# Deploys the ggov-frontend-testnet Cloudflare Worker (CLOUDFLARE_ENV=testnet build) on merge to main.
# Path-scoped so contracts-only merges don't trigger a redundant frontend deploy;
# use the "Run workflow" button (workflow_dispatch) to deploy on demand.
#
# Required secrets (repo or `frontend-testnet` environment):
#   CLOUDFLARE_API_TOKEN   - Workers deploy token (Account > Workers Scripts: Edit)
#   CLOUDFLARE_ACCOUNT_ID  - target Cloudflare account id
#   ALGOD_TOKEN            - privileged Algod token; uploaded as a Worker secret
#                            (optional — if unset, SSR reads fall back to the
#                            public VITE_ALGOD_TOKEN from .env.testnet)
on:
  push:
    branches: [main]
    paths:
      - 'projects/ggov-frontend/**'
      - 'projects/ggov-sdk/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: frontend-cd
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy-testnet:
    runs-on: 'ubuntu-latest'
    environment: frontend-testnet
    env:
      # non-secret boolean only; the actual token stays step-level
      HAS_ALGOD_TOKEN: ${{ secrets.ALGOD_TOKEN != '' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install pnpm
        # No `version` here — it's read from the root package.json `packageManager`
        # field. Pinning both collides (ERR_PNPM_BAD_PM_VERSION).
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Use Node.js 22.19
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.19.x'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ggov-frontend consumes ggov-sdk via `link:../ggov-sdk` (built dist/). The
      # generated clients are committed, so a plain tsc builds it — no algokit.
      - name: Build ggov-sdk
        run: pnpm --filter ggov-sdk build

      # `deploy:testnet` = typecheck && CLOUDFLARE_ENV=testnet vite build --mode testnet && wrangler deploy.
      # CLOUDFLARE_ENV makes @cloudflare/vite-plugin emit the ggov-frontend-testnet config.
      # Reads public client config from .env.testnet; authenticates to Cloudflare
      # with CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID.
      - name: Build & deploy Worker (testnet)
        working-directory: projects/ggov-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:testnet

      # Upload the privileged Algod token as a Worker secret (server-only; never in
      # the client bundle). `--env testnet` targets the ggov-frontend-testnet worker.
      # Runs after deploy so the Worker exists; secrets persist across deploys, so this
      # just keeps it in sync. Skipped when the secret is unset.
      - name: Set ALGOD_TOKEN Worker secret
        if: ${{ env.HAS_ALGOD_TOKEN == 'true' }}
        working-directory: projects/ggov-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALGOD_TOKEN: ${{ secrets.ALGOD_TOKEN }}
        run: printf '%s' "$ALGOD_TOKEN" | pnpm wrangler secret put ALGOD_TOKEN --env testnet
