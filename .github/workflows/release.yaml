name: Release

# Automatic release on push to main is disabled. Run manually via the
# "Run workflow" button (workflow_dispatch). To re-enable automatic releases,
# restore the `push` trigger below.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - 'docs/**'
  #     - '**.md'
  #     - '.vscode/**'
  #     - '.idea/**'

permissions:
  contents: read
  packages: read

jobs:
  contracts-validate:
    name: Run contracts release
    secrets: inherit
    uses: ./.github/workflows/contracts-ci.yaml

  contracts-release:
    name: Run contracts release
    secrets: inherit
    uses: ./.github/workflows/contracts-cd.yaml
    needs: contracts-validate
