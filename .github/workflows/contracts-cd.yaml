name: Deploy contracts (testnet)

# Deploys smart contracts to testnet via `algokit project deploy testnet`.
# Manual only — run from the Actions tab once the `contract-testnet` environment
# is configured (deployment branches: main; secrets below).
#
# Required secrets (`contract-testnet` environment):
#   DEPLOYER_MNEMONIC   - account that becomes the creator/operator of the contracts
#   DISPENSER_MNEMONIC  - funds the deployer if its balance is low
on:
  workflow_dispatch:

# Never interrupt an in-flight contract deploy.
concurrency:
  group: contracts-cd
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy-testnet:
    runs-on: ubuntu-latest
    environment: contract-testnet
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install pnpm
        # No `version` here — it's read from the root package.json `packageManager`
        # field. Pinning both collides (ERR_PNPM_BAD_PM_VERSION).
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Use Node.js 22.19
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.19.x'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install algokit
        run: pipx install algokit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: algokit project run build --project-name 'contracts'

      - name: Check artifacts are up to date
        run: |
          if [ -n "$(git status --porcelain projects/contracts/smart_contracts/artifacts)" ]; then
            echo "Artifacts are out of date — run 'algokit project run build --project-name contracts' and commit the results."
            git status --short projects/contracts/smart_contracts/artifacts
            exit 1
          fi

      - name: Build SDK
        run: algokit project run build --project-name 'ggov-sdk'

      - name: Deploy to testnet
        run: algokit project deploy testnet --project-name 'contracts'
        env:
          # This is the account that becomes the creator of the contract
          DEPLOYER_MNEMONIC: ${{ secrets.DEPLOYER_MNEMONIC }}
          # The dispenser account is used to ensure the deployer account is funded
          DISPENSER_MNEMONIC: ${{ secrets.DISPENSER_MNEMONIC }}
