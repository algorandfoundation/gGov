name: Deploy Storybook

# Builds the frontend Storybook and deploys it as a static-assets Cloudflare Worker
# (ggov-storybook) on merge to main. Reuses the `frontend-testnet` environment to
# inherit the same Cloudflare credentials as the app deploy.
#
# Path-scoped so unrelated merges don't trigger a redundant deploy; use the
# "Run workflow" button (workflow_dispatch) to deploy on demand.
#
# Required secrets (`frontend-testnet` environment — shared with frontend-cd):
#   CLOUDFLARE_API_TOKEN   - Workers Scripts: Edit (same token as the app deploy)
#   CLOUDFLARE_ACCOUNT_ID  - target Cloudflare account id
on:
  push:
    branches: [main]
    paths:
      - 'projects/ggov-frontend/**'
      - 'projects/ggov-sdk/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/storybook-cd.yaml'
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: storybook-cd
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy-storybook:
    runs-on: 'ubuntu-latest'
    environment: frontend-testnet
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # No `version` here: pnpm/action-setup reads it from the root package.json
      # `packageManager` field. Pinning it too collides (ERR_PNPM_BAD_PM_VERSION).
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Use Node.js 22.19
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.19.x'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ggov-frontend consumes ggov-sdk via `link:../ggov-sdk` (built dist/). The
      # generated clients are committed, so a plain tsc builds it — no algokit.
      - name: Build ggov-sdk
        run: pnpm --filter ggov-sdk build

      # `build-storybook` = STORYBOOK=true storybook build → static export at
      # projects/ggov-frontend/storybook-static (no server entry).
      - name: Build Storybook
        working-directory: projects/ggov-frontend
        run: pnpm build-storybook

      # Assets-only Worker (see wrangler.storybook.jsonc) serving storybook-static.
      # Authenticates to Cloudflare with CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID.
      - name: Deploy Storybook Worker
        working-directory: projects/ggov-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm wrangler deploy --config wrangler.storybook.jsonc
