name: Validate contracts

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install algokit
        run: pipx install algokit

      # - name: Format check
      #   run: algokit project run format-check

      # - name: Lint
      #   run: algokit project run lint

      # - name: Typecheck
      #   run: algokit project run typecheck

      - name: Build smart contracts
        run: algokit project run build --project-name 'contracts'

      - name: Build SDKs
        run: algokit project run build --project-name 'ggov-sdk' --project-name 'delegator-sdk'

      - name: Build frontend
        run: algokit project run build --project-name 'ggov-frontend'

      - name: Upload SDK build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-build
          path: |
            projects/ggov-sdk/dist
            projects/delegator-sdk/dist
          retention-days: 1

      # - name: Scan TEAL files for issues
      #   run: algokit project run audit-teal --project-name 'contracts'

      # # Uncomment to enable TEAL static analysis with snapshoting using Tealer package
      # # Would first require running locally using audit-teal command and committing the snapshots into source control
      # # Please note, tealer has a known bug that may result in large snapshot file sizes, track resolution here:
      # # https://github.com/crytic/tealer/issues/101
      # - name: Check output stability of the smart contracts
      #   run: algokit project run ci-teal-diff --project-name 'contracts'

      - name: Start LocalNet
        run: algokit localnet start

      - name: Run deployer against LocalNet
        run: algokit project deploy localnet --project-name 'contracts'

  test:
    name: Test ${{ matrix.name }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: registry
            args: smart_contracts/ggov-registry --exclude '**/ggovRegistry.reader*'
          - name: registry-reader
            args: ggovRegistry.reader
          - name: period
            args: smart_contracts/ggov-period
          - name: remaining contracts
            args: --exclude='smart_contracts/ggov-registry/**' --exclude='smart_contracts/ggov-period/**'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install algokit
        run: pipx install algokit

      - name: Download SDK build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-build
          path: projects

      - name: Start LocalNet
        run: algokit localnet start

      - name: Run tests
        timeout-minutes: 15
        env:
          NOOP_TEST_LOGGER: true
        run: pnpm --filter smart_contracts exec vitest run --reporter=verbose ${{ matrix.args }}
