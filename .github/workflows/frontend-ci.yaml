name: Validate frontend

on:
  workflow_call:

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ggov-frontend consumes ggov-sdk via `link:../ggov-sdk`, which resolves to
      # its built dist/. The generated clients (src/generated) are committed, so a
      # plain `tsc` builds it — no contracts/algokit build needed here.
      - name: Build ggov-sdk
        run: pnpm --filter ggov-sdk build

      # Runs `tsr generate` then `tsc --noEmit` (see package.json) so a clean
      # checkout typechecks without a prior vite build.
      - name: Typecheck frontend
        run: pnpm --filter ggov-frontend typecheck

      - name: Build frontend
        run: pnpm --filter ggov-frontend build
