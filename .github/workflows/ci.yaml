name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.detect.outputs.contracts }}
      puya_ts: ${{ steps.detect.outputs.puya_ts }}
      committee_uploader: ${{ steps.detect.outputs.committee_uploader }}
      algohours_calculator: ${{ steps.detect.outputs.algohours_calculator }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Detect changed units
        id: detect
        run: |
          set -euo pipefail

          # workflow_dispatch has no base_ref — treat as full run
          if [ -z "${{ github.base_ref }}" ]; then
            {
              echo "contracts=true"
              echo "puya_ts=true"
              echo "committee_uploader=true"
              echo "algohours_calculator=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)

          echo "Changed files:"
          echo "$changed"

          {
            echo "contracts=false"
            echo "puya_ts=false"
            echo "committee_uploader=false"
            echo "algohours_calculator=false"
          } >> "$GITHUB_OUTPUT"

          grep -qE '^projects/(contracts|[^/]+-sdk)/|^pnpm-lock\.yaml|^package\.json$|^pnpm-workspace\.yaml$|^\.github/workflows/ci\.yaml' \
            <<<"$changed" && echo "contracts=true" >> "$GITHUB_OUTPUT" || true
          grep -qE '^projects/contracts/smart_contracts/.*\.algo\.ts$' \
            <<<"$changed" && echo "puya_ts=true"   >> "$GITHUB_OUTPUT" || true
          grep -qE '^projects/common/ggov-committee-uploader/|^projects/ggov-sdk/|^projects/common/eslint\.config\.mjs$|^eslint\.config\.base\.mjs$|^\.prettier(ignore|rc)$|^pnpm-lock\.yaml$|^package\.json$|^pnpm-workspace\.yaml$|^\.github/workflows/ci\.yaml$' \
            <<<"$changed" && echo "committee_uploader=true" >> "$GITHUB_OUTPUT" || true
          grep -qE '^projects/common/ggov-algohours-calculator/|^projects/common/eslint\.config\.mjs$|^eslint\.config\.base\.mjs$|^\.prettier(ignore|rc)$|^pnpm-lock\.yaml$|^package\.json$|^pnpm-workspace\.yaml$|^\.github/workflows/ci\.yaml$' \
            <<<"$changed" && echo "algohours_calculator=true" >> "$GITHUB_OUTPUT" || true

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  validate:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate committee uploader
        if: needs.changes.outputs.committee_uploader == 'true'
        run: |
          pnpm --filter ggov-committees format:check
          pnpm --filter ggov-committees lint
          pnpm --filter ggov-committees typecheck

      - name: Validate algohours calculator
        if: needs.changes.outputs.algohours_calculator == 'true'
        run: |
          pnpm --filter ggov-algohours-calculator format:check
          pnpm --filter ggov-algohours-calculator lint
          pnpm --filter ggov-algohours-calculator typecheck
          pnpm --filter ggov-algohours-calculator test

      - name: Install algokit
        run: pipx install algokit

      - name: Format check
        run: algokit project run format-check

      - name: Lint
        run: algokit project run lint

      - name: Build smart contracts
        run: algokit project run build --project-name 'contracts'

      - name: Check committed artifacts are up to date
        run: |
          if [ -n "$(git status --porcelain projects/contracts/smart_contracts/artifacts)" ]; then
            echo "Artifacts are out of date — run 'algokit project run build --project-name contracts' and commit the results."
            git status --short projects/contracts/smart_contracts/artifacts
            exit 1
          fi

      - name: Build SDKs
        run: algokit project run build --project-name 'ggov-sdk' --project-name 'delegator-sdk'

      - name: Typecheck
        run: algokit project run typecheck

      - name: Build frontend
        run: algokit project run build --project-name 'ggov-frontend'

      - name: Scan TEAL files for issues
        if: needs.changes.outputs.puya_ts == 'true'
        run: algokit project run audit-teal --project-name 'contracts'

      - name: Start LocalNet
        run: algokit localnet start

      - name: Run deployer against LocalNet
        run: algokit project deploy localnet --project-name 'contracts'

  test:
    name: test ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: registry
            args: smart_contracts/ggov-registry --exclude '**/ggovRegistry.reader*'
          - name: registry reader
            args: ggovRegistry.reader
          - name: period
            args: smart_contracts/ggov-period
          - name: remaining contracts
            args: --exclude='smart_contracts/ggov-registry/**' --exclude='smart_contracts/ggov-period/**'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install algokit
        run: pipx install algokit

      - name: Build SDKs
        run: algokit project run build --project-name 'ggov-sdk' --project-name 'delegator-sdk'

      - name: Start LocalNet
        run: algokit localnet start

      - name: Run tests
        timeout-minutes: 15
        env:
          NOOP_TEST_LOGGER: true
        run: pnpm --filter smart_contracts exec vitest run --reporter=verbose ${{ matrix.args }}

  algohours-live-verification:
    name: algohours live verification
    needs: changes
    if: needs.changes.outputs.algohours_calculator == 'true'
    environment: indexer-mainnet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify tinyman balances against live chain state
        env:
          INDEXER_SERVER: ${{ vars.INDEXER_SERVER }}
          INDEXER_TOKEN: ${{ secrets.INDEXER_TOKEN }}
        run: pnpm --filter ggov-algohours-calculator verify:tinyman

      - name: Verify reti balances against live chain state
        if: always() && steps.install.outcome == 'success'
        env:
          INDEXER_SERVER: ${{ vars.INDEXER_SERVER }}
          INDEXER_TOKEN: ${{ secrets.INDEXER_TOKEN }}
        run: pnpm --filter ggov-algohours-calculator verify:reti
